x-backend: &backend
  build: ./docker/php
  working_dir: /var/www/backend
  volumes:
    - ./backend:/var/www/backend
  environment: &backend-env
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-formsender}
    DB_USERNAME: ${DB_USERNAME:-formsender}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    PANEL_URL: http://localhost:${FRONTEND_PORT:-3000}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mailpit:
      condition: service_healthy

services:
  app:
    <<: *backend
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      RUN_SEED: "true"
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  queue:
    <<: *backend
    # The worker leaves by itself every hour (--max-time) so it never grows old: Docker must bring it back.
    restart: unless-stopped
    command: php artisan queue:work --sleep=1 --max-time=3600
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  scheduler:
    <<: *backend
    restart: unless-stopped
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Server-side target of the /api proxy; the browser only talks to the frontend.
      API_URL: http://app:8000
      # Where the browser reaches the API (the docs live at its root).
      NEXT_PUBLIC_API_PORT: ${APP_PORT:-8000}
      # Where the browser reaches Mailpit (the panel links to it for administrators).
      NEXT_PUBLIC_MAILPIT_PORT: ${MAILPIT_UI_PORT:-8025}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # Healthy only once the frontend is up AND can reach the API through its proxy.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/setup').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 120s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-formsender}
      POSTGRES_USER: ${DB_USERNAME:-formsender}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-formsender} -d ${DB_DATABASE:-formsender}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  frontend_node_modules:
